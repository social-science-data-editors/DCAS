<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
            <li class="p-name"><a href="{{ site.url }}">{{ site.url }}</a></li>
            <li class="p-name">Version {{ site.version | escape }} ({{ site.date }})</li>
            <li class="p-name">DOI: <a href="https://doi.org/{{ site.doi }}">{{ site.doi }}</a></li>
          </ul>
      </div>
      <div class="footer-col footer-col-2">
        <div style="text-align: center;">
          <a href="https://social-science-data-editors.github.io/">
            <img src="{{ "/assets/img/ssde-logo-only.png" | relative_url }}" alt="Social Science Data Editors" style="height: 60px; margin-bottom: 10px;">
          </a>
          <p style="margin: 0;">Maintained by <a href="https://social-science-data-editors.github.io/">Social Science Data Editors</a></p>
        </div>
      </div>
      <div class="footer-col footer-col-1" style="text-align: right;">
        <ul class="contact-list" style="list-style: none; text-align: right;">
            <li class="p-name">{{ site.disclaimer | escape }}</li>
            <li class="p-name">Licensed under <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0 Universal</a></li>
          </ul>
      </div>
    </div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

  </div>

</footer>
